services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    image: ${API_IMAGE:-gonerp-api:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    volumes:
      - uploads_data:/app/uploads

  web:
    build: ./frontend
    image: ${WEB_IMAGE:-gonerp-web:latest}
    restart: unless-stopped
    depends_on:
      - api
    # Không bind cổng host nữa: proxy chung ở /opt/proxy giữ 80/443 và chuyển
    # tiếp vào đây qua mạng `edge`. Nhờ vậy zielstation (và app sau này) dùng
    # chung được hai cổng đó mà không tranh nhau.
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      default:
      edge:
        # zielstation cũng có service tên `web`; alias riêng để proxy không
        # route nhầm giữa hai app.
        aliases:
          - gonerp-web

networks:
  edge:
    external: true

volumes:
  postgres_data:
  uploads_data:
